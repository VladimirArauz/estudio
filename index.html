<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estudio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f4f6f9;
      color: #222;
    }
    .menu-btn {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 20;
      background: #2c3e50;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 22px;
      padding: 6px 12px;
      cursor: pointer;
    }
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 240px;
      height: 100%;
      background: #2c3e50;
      color: #fff;
      padding-top: 70px;
      transform: translateX(-100%);
      transition: transform 0.3s ease;
      z-index: 10;
    }
    .sidebar.abierto { transform: translateX(0); }
    .seccion {
      width: 100%;
      background: none;
      border: none;
      color: #fff;
      font-size: 18px;
      text-align: left;
      padding: 14px 20px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
    }
    .seccion:hover { background: #34495e; }
    .flecha { transition: transform 0.3s; }
    .seccion.abierta .flecha { transform: rotate(90deg); }
    .submenu {
      list-style: none;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
      background: #233140;
    }
    .submenu.abierto { max-height: 200px; }
    .submenu a {
      display: block;
      padding: 10px 36px;
      color: #cfd8e3;
      text-decoration: none;
    }
    .submenu a:hover { background: #2c3e50; color: #fff; }
    main {
      padding: 80px 24px 24px;
      transition: margin-left 0.3s ease;
    }
    main.desplazado { margin-left: 240px; }
    h1 { margin-bottom: 12px; color: #2c3e50; }
    .oculto { display: none; }

    /* Tarjetas de Apoyo */
    .tarjetas {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 16px;
    }
    .tarjeta {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      text-align: center;
      border: 3px solid transparent;
      transition: border-color 0.3s;
    }
    .tarjeta.resaltada { border-color: #2980b9; }
    .tarjeta svg { display: block; width: 100%; height: 130px; }
    .tarjeta .cuerpo { padding: 14px 16px 18px; }
    .tarjeta h2 { font-size: 20px; color: #2c3e50; }
    .tarjeta .etiqueta {
      font-size: 14px;
      color: #2980b9;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .tarjeta .dato { margin: 4px 0; color: #555; }
    .tarjeta .dato b { color: #222; }
    .btn-apoyo {
      margin-top: 12px;
      background: #2980b9;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 8px 24px;
      font-size: 16px;
      cursor: pointer;
    }
    .btn-apoyo:hover { background: #1f6391; }
    .tarjeta { position: relative; }
    .btn-borrar {
      position: absolute;
      top: 6px;
      right: 8px;
      background: rgba(0, 0, 0, 0.35);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      font-size: 18px;
      cursor: pointer;
    }
    .btn-borrar:hover { background: #c0392b; }

    /* Botón para agregar materias */
    .agregar {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 20;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: none;
      background: #2980b9;
      color: #fff;
      font-size: 34px;
      line-height: 1;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
    }
    .agregar:hover { background: #1f6391; }
    .fondo {
      position: fixed;
      inset: 0;
      z-index: 30;
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .fondo.oculto { display: none; }
    .modal {
      background: #fff;
      border-radius: 10px;
      padding: 24px;
      width: 100%;
      max-width: 420px;
    }
    .modal h2 { color: #2c3e50; margin-bottom: 8px; }
    .modal label { display: block; margin: 14px 0 6px; font-weight: bold; color: #2c3e50; }
    .modal input[type="text"] {
      width: 100%;
      padding: 8px 10px;
      font-size: 16px;
      border: 1px solid #ccd3da;
      border-radius: 6px;
    }
    .modal .fila { display: flex; gap: 12px; }
    .modal .fila > div { flex: 1; }
    .modal input[type="color"] { width: 100%; height: 38px; border: none; cursor: pointer; }
    .modal .acciones { margin-top: 20px; display: flex; justify-content: flex-end; gap: 10px; }
    .btn-secundario {
      background: #dfe4ea;
      color: #222;
      border: none;
      border-radius: 6px;
      padding: 8px 20px;
      font-size: 16px;
      cursor: pointer;
    }

    @media (max-width: 700px) {
      main.desplazado { margin-left: 0; }
      .tarjetas { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <button class="menu-btn" id="menuBtn" aria-label="Abrir menú">&#9776;</button>

  <nav class="sidebar" id="sidebar">
    <button class="seccion" data-vista="vistaEstudio">
      Estudio <span class="flecha">&#9656;</span>
    </button>
    <ul class="submenu">
      <li><a href="#">Apuntes</a></li>
      <li><a href="#">Tareas</a></li>
      <li><a href="#">Exámenes</a></li>
    </ul>

    <button class="seccion" data-vista="vistaApoyo">
      Apoyo <span class="flecha">&#9656;</span>
    </button>
    <ul class="submenu" id="submenuApoyo"></ul>
  </nav>

  <main id="contenido">
    <section id="vistaEstudio">
      <h1>Estudio</h1>
      <p>Bienvenido a tu sección de estudio. Usa el menú de la izquierda para navegar.</p>
    </section>

    <section id="vistaApoyo" class="oculto">
      <h1>Apoyo</h1>
      <p>Elige la materia en la que necesitas apoyo.</p>
      <div class="tarjetas" id="tarjetas"></div>
    </section>
  </main>

  <button class="agregar" id="agregar" title="Agregar materia" aria-label="Agregar materia">+</button>

  <div class="fondo oculto" id="fondo">
    <form class="modal" id="formulario">
      <h2>Nueva materia</h2>
      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" placeholder="Ej. Electricidad" required>
      <div class="fila">
        <div>
          <label for="simbolo">Símbolo</label>
          <input type="text" id="simbolo" placeholder="⚡" maxlength="6">
        </div>
        <div>
          <label for="color">Color</label>
          <input type="color" id="color" value="#8e44ad">
        </div>
      </div>
      <label for="archivos">Material (opcional)</label>
      <input type="file" id="archivos" multiple>
      <div class="acciones">
        <button type="button" class="btn-secundario" id="cancelar">Cancelar</button>
        <button type="submit" class="btn-apoyo">Guardar</button>
      </div>
    </form>
  </div>

  <script src="materias.js"></script>
  <script src="db.js"></script>
  <script>
    const menuBtn = document.getElementById("menuBtn");
    const sidebar = document.getElementById("sidebar");
    const contenido = document.getElementById("contenido");
    const submenuApoyo = document.getElementById("submenuApoyo");
    const tarjetas = document.getElementById("tarjetas");

    function agregarMateria(materia) {
      const nombre = escapar(materia.nombre);
      submenuApoyo.insertAdjacentHTML("beforeend",
        `<li id="menu-${materia.id}"><a href="#" data-materia="${materia.id}">${nombre}</a></li>`);
      tarjetas.insertAdjacentHTML("beforeend", `
        <div class="tarjeta" id="tarjeta-${materia.id}">
          ${materia.propia ? `<button class="btn-borrar" data-borrar="${materia.id}" title="Eliminar materia">&times;</button>` : ""}
          ${imagenMateria(materia)}
          <div class="cuerpo">
            <h2>${nombre}</h2>
            <div class="etiqueta">Apoyo</div>
            ${materia.propia
              ? `<p class="dato">Archivos: <b class="archivos">0</b></p>`
              : `<p class="dato">Apuntes: <b>${materia.apuntes}</b></p>
                 <p class="dato">Asesores: <b>${materia.asesores.length}</b></p>`}
            <button class="btn-apoyo" data-materia="${materia.id}">Apoyo</button>
          </div>
        </div>`);
      if (materia.propia) {
        DB.listarArchivos(materia.id).then(lista => {
          document.querySelector(`#tarjeta-${materia.id} .archivos`).textContent = lista.length;
        });
      }
    }

    materias.forEach(agregarMateria);
    DB.listarMaterias().then(propias => propias.forEach(agregarMateria));

    function mostrarVista(id) {
      document.querySelectorAll("main section").forEach(s => s.classList.add("oculto"));
      document.getElementById(id).classList.remove("oculto");
    }

    menuBtn.addEventListener("click", () => {
      sidebar.classList.toggle("abierto");
      contenido.classList.toggle("desplazado");
    });

    document.querySelectorAll(".seccion").forEach(seccion => {
      seccion.addEventListener("click", () => {
        seccion.classList.toggle("abierta");
        seccion.nextElementSibling.classList.toggle("abierto");
        mostrarVista(seccion.dataset.vista);
      });
    });

    // El botón "Apoyo" abre la página de la materia en una ventana nueva.
    tarjetas.addEventListener("click", e => {
      const borrar = e.target.closest(".btn-borrar");
      if (borrar) {
        const id = borrar.dataset.borrar;
        const nombre = document.querySelector(`#tarjeta-${id} h2`).textContent;
        if (!confirm(`¿Eliminar "${nombre}" y todo su material?`)) return;
        DB.borrarMateria(id).then(() => {
          document.getElementById("tarjeta-" + id).remove();
          document.getElementById("menu-" + id).remove();
        });
        return;
      }
      const boton = e.target.closest(".btn-apoyo");
      if (!boton) return;
      window.open("materia.html?m=" + boton.dataset.materia, "_blank");
    });

    function resaltar(id) {
      mostrarVista("vistaApoyo");
      document.querySelectorAll(".tarjeta").forEach(t => t.classList.remove("resaltada"));
      const tarjeta = document.getElementById("tarjeta-" + id);
      tarjeta.classList.add("resaltada");
      tarjeta.scrollIntoView({ behavior: "smooth", block: "center" });
    }

    submenuApoyo.addEventListener("click", e => {
      const enlace = e.target.closest("a");
      if (!enlace) return;
      e.preventDefault();
      resaltar(enlace.dataset.materia);
    });

    // Botón "+" para crear materias nuevas con su material.
    const fondo = document.getElementById("fondo");
    const formulario = document.getElementById("formulario");

    function cerrarFormulario() {
      fondo.classList.add("oculto");
      formulario.reset();
    }

    document.getElementById("agregar").addEventListener("click", () => {
      fondo.classList.remove("oculto");
      document.getElementById("nombre").focus();
    });
    document.getElementById("cancelar").addEventListener("click", cerrarFormulario);
    fondo.addEventListener("click", e => { if (e.target === fondo) cerrarFormulario(); });

    formulario.addEventListener("submit", e => {
      e.preventDefault();
      const nombre = document.getElementById("nombre").value.trim();
      if (!nombre) return;
      const materia = {
        id: "m" + Date.now(),
        nombre,
        simbolo: document.getElementById("simbolo").value.trim() || nombre.slice(0, 3).toUpperCase(),
        color: document.getElementById("color").value,
        asesores: [],
        material: {},
        propia: true
      };
      const archivos = document.getElementById("archivos").files;
      DB.crearMateria(materia)
        .then(() => DB.agregarArchivos(materia.id, archivos))
        .then(() => {
          cerrarFormulario();
          agregarMateria(materia);
          resaltar(materia.id);
        })
        .catch(err => alert("No se pudo guardar la materia: " + err));
    });
  </script>
</body>
</html>
