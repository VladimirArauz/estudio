<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apoyo · Bátiz hasta la muerte</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Schibsted+Grotesk:ital,wght@0,400;0,500;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/components.css">
  <script src="scripts/tema-temprano.js"></script>
</head>
<body data-activa="apoyo" style="--sec: var(--sec-apoyo)">
  <main id="contenido" class="contenedor" tabindex="-1">
    <header class="cabecera-pagina" id="encabezado">
      <nav class="migas" aria-label="Ruta"><a href="index.html#apoyo">Lámina 02 · Apoyo</a><span>/</span><span id="migaMateria">Materia</span></nav>
      <p class="cargando">Cargando materia…</p>
    </header>

    <div class="pila" style="gap: var(--e-6)">
      <div class="pestanas" role="tablist" aria-label="Secciones de la materia" id="vistas">
        <button class="chip" role="tab" data-vista="vistaAsesores" aria-selected="true">Asesores</button>
        <button class="chip" role="tab" data-vista="vistaMaterial" aria-selected="false">Material</button>
        <button class="chip" role="tab" data-vista="vistaCursos" aria-selected="false">Cursos</button>
      </div>

      <section id="vistaAsesores" role="tabpanel" class="pila">
        <h2 class="lamina__titulo">Asesores</h2>
        <ul class="filas" id="listaAsesores"></ul>
      </section>

      <section id="vistaMaterial" role="tabpanel" class="pila" hidden>
        <div class="herramientas">
          <h2 class="lamina__titulo">Material de apoyo</h2>
          <button class="btn btn--secundario" type="button" id="agregar" data-rol="alumno profesor admin" hidden>Subir material</button>
        </div>
        <p class="nota" data-rol="invitado" hidden><span class="rotulo">Nota</span><span><a href="login.html">Inicia sesión</a> para subir material de apoyo.</span></p>
        <nav class="pestanas" id="pestanas" aria-label="Tipo de material"></nav>
        <ul class="filas" id="listaMaterial"></ul>
      </section>

      <section id="vistaCursos" role="tabpanel" class="pila" hidden>
        <div class="herramientas">
          <h2 class="lamina__titulo">Cursos</h2>
          <div class="fila" id="accionesProfesor" data-rol="profesor admin" hidden></div>
        </div>
        <div class="piezas" id="listaCursos"></div>
      </section>
    </div>
  </main>

  <dialog class="modal" id="dialogoPostular">
    <form class="modal__cuerpo form" id="formPostular">
      <p class="rotulo">Apoyo · Postulación</p>
      <h2 class="modal__titulo">Postularme como profesor</h2>
      <div class="campo">
        <label for="mensajePostular">¿Por qué quieres dar esta materia?</label>
        <textarea id="mensajePostular" maxlength="1000" required placeholder="Tu experiencia, horarios disponibles, temas que dominas…"></textarea>
      </div>
      <p class="form__mensaje form__mensaje--error" role="alert"></p>
      <div class="form__acciones">
        <button type="button" class="btn btn--secundario" data-cerrar>Cancelar</button>
        <button type="submit" class="btn btn--secundario">Enviar postulación</button>
      </div>
    </form>
  </dialog>

  <dialog class="modal" id="dialogoCurso">
    <form class="modal__cuerpo form" id="formCurso">
      <p class="rotulo">Apoyo · Nuevo curso</p>
      <h2 class="modal__titulo">Crear curso</h2>
      <div class="campo">
        <label for="tituloCurso">Nombre del curso</label>
        <input type="text" id="tituloCurso" maxlength="160" required placeholder="Ej. Álgebra para el examen de admisión">
      </div>
      <div class="campo">
        <label for="descripcionCurso">Descripción</label>
        <textarea id="descripcionCurso" maxlength="2000" placeholder="Qué vas a enseñar, horarios, forma de evaluar…"></textarea>
      </div>
      <p class="form__mensaje form__mensaje--error" role="alert"></p>
      <div class="form__acciones">
        <button type="button" class="btn btn--secundario" data-cerrar>Cancelar</button>
        <button type="submit" class="btn btn--secundario">Crear curso</button>
      </div>
    </form>
  </dialog>

  <script src="scripts/util.js"></script>
  <script src="scripts/api.js"></script>
  <script src="scripts/nav.js"></script>
  <script src="scripts/analitica.js"></script>
  <script src="scripts/subir.js"></script>
  <script src="scripts/materia.js"></script>
</body>
</html>
