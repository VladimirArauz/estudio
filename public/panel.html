<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Panel de administración de Bátiz hasta la muerte: materias, archivos, cursos y cuentas del sitio.">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Bátiz hasta la muerte">
  <meta property="og:locale" content="es_MX">
  <meta property="og:title" content="Panel de control · Bátiz hasta la muerte">
  <meta property="og:description" content="Panel de administración de Bátiz hasta la muerte: materias, archivos, cursos y cuentas del sitio.">
  <meta property="og:image" content="img/vista-previa.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Bátiz hasta la muerte: apuntes, tareas, exámenes y preparación del CECyT 9 en un solo lugar.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Schibsted+Grotesk:ital,wght@0,400;0,500;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/components.css">
  <script src="scripts/tema-temprano.js"></script>
</head>
<body data-pagina="panel" style="--sec: var(--sec-estudio)">
  <main id="contenido" class="contenedor" tabindex="-1">
    <header class="cabecera-pagina">
      <p class="rotulo">Administración · Solo admin</p>
      <h1 class="cabecera-pagina__titulo">Panel de control</h1>
      <div class="cota" aria-hidden="true"><span class="cota__linea"></span><span class="cota__medida">10 secciones</span></div>
    </header>
    <div class="pila" style="gap: var(--e-6)">
      <div class="pestanas" role="tablist" aria-label="Secciones del panel" id="pestanasPanel"></div>
      <section id="panelAdmin" role="tabpanel" class="pila" style="gap: var(--e-5)" aria-busy="true"></section>
    </div>
  </main>

  <dialog class="modal" id="dialogoMateria">
    <form class="modal__cuerpo form" id="formMateria">
      <p class="rotulo">Materias</p>
      <h2 class="modal__titulo" id="tituloDialogoMateria">Materia</h2>
      <div class="form__fila">
        <div class="campo"><label for="mNombre">Nombre</label><input id="mNombre" maxlength="120" required></div>
        <div class="campo"><label for="mSimbolo">Símbolo</label><input id="mSimbolo" maxlength="12"></div>
        <div class="campo"><label for="mOrden">Orden</label><input id="mOrden" type="number" value="0"></div>
      </div>
      <div class="campo"><label for="mArea">Área o carrera</label><input id="mArea" maxlength="60" list="listaAreas" placeholder="Tronco común">
        <datalist id="listaAreas"></datalist></div>
      <div class="campo"><label for="mDescripcion">Descripción</label><textarea id="mDescripcion" maxlength="2000"></textarea></div>
      <div class="campo"><label for="mAsesores">Asesores (uno por línea)</label><textarea id="mAsesores"></textarea></div>
      <p class="form__mensaje form__mensaje--error" role="alert"></p>
      <div class="form__acciones">
        <button type="button" class="btn btn--secundario" data-cerrar>Cancelar</button>
        <button type="submit" class="btn btn--primario">Guardar materia</button>
      </div>
    </form>
  </dialog>

  <script src="scripts/util.js"></script>
  <script src="scripts/api.js"></script>
  <script src="scripts/nav.js"></script>
  <script src="scripts/analitica.js"></script>
  <script src="scripts/subir.js"></script>
  <script src="scripts/panel.js"></script>
</body>
</html>
